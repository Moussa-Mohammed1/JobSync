<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>JobSync</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header>
      <h1>JobSync</h1>
      <span id="detectionStatus" class="status-dot"></span>
    </header>

    <div id="statusSection" class="section">
      <div class="status-row">
        <span class="label">Website:</span>
        <span id="website" class="value">-</span>
      </div>
      <div class="status-row">
        <span class="label">Company:</span>
        <span id="company" class="value">-</span>
      </div>
      <div class="status-row">
        <span class="label">Position:</span>
        <span id="position" class="value">-</span>
      </div>
      <div class="status-row">
        <span class="label">Detection:</span>
        <span id="detectionLabel" class="value">Waiting...</span>
      </div>
    </div>

    <div id="infoSection" class="section" style="display:none;">
      <div class="info-grid">
        <div class="info-item">
          <span class="label">Location</span>
          <span id="infoLocation" class="value">-</span>
        </div>
        <div class="info-item">
          <span class="label">Salary</span>
          <span id="infoSalary" class="value">-</span>
        </div>
        <div class="info-item">
          <span class="label">Type</span>
          <span id="infoType" class="value">-</span>
        </div>
        <div class="info-item">
          <span class="label">Remote</span>
          <span id="infoRemote" class="value">-</span>
        </div>
      </div>
    </div>

    <div class="actions">
      <button id="saveBtn" class="btn btn-primary">
        <span class="btn-icon">+</span>
        Save Current Job
      </button>
      <button id="optionsBtn" class="btn btn-secondary">
        <span class="btn-icon">&#9881;</span>
        Settings
      </button>
    </div>

    <div id="messageArea" class="message" style="display:none;"></div>

    <footer>
      <button id="historyBtn" class="btn btn-text">View History</button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
