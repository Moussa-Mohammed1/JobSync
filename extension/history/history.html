<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>JobSync - History</title>
  <link rel="stylesheet" href="history.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Application History</h1>
      <p class="subtitle">Recently saved job applications</p>
    </header>

    <div class="controls">
      <input type="text" id="searchInput" placeholder="Search by company, title..." class="search-input">
      <button id="refreshBtn" class="btn btn-secondary">Refresh</button>
    </div>

    <div id="historyList" class="history-list">
      <div class="empty-state">No applications saved yet.</div>
    </div>
  </div>

  <script src="history.js"></script>
</body>
</html>
